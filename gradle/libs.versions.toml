[versions]
#jetbrains
kotlin = "2.4.21"
#Detekt
detekt = "1.23.8"
detektCompose = "0.4.28"
activityCompose = "1.13.0"
composeBom = "2026.11.01"
material3Expressive = "1.5.0"
navigation = "2.9.0"
#AndroidX
androidx-lifecycle = "2.10.0"
androidx-documentfile = "1.1.0"
#exif
exif = "1.4.2"
#Gradle
gradlePlugins-agp = "9.2.1"
#Media3
media3 = "1.11.1"
#Test
junit = "4.13.2"
#build
app-build-compileSDKVersion = "37"
app-build-targetSDK = "36"
app-build-minimumSDK = "33"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"

[libraries]
#Jetpack Compose / Material 3 Expressive
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3Expressive" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

#AndroidX Lifecycle
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }

#Media3 native Compose video engine (no XML PlayerView)
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }

#ExifInterface
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exif" }

#Compose Detekt
compose-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }

#Test
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
